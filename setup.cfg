[flake8]
max-line-length = 120
per-file-ignores =
    */__init__.py: F401, E402
exclude = .git,.venv*,.pytest_cache,__pycache__,prepare_submission.py

[coverage:run]
branch = True
source = .
omit =
    tests/*
    .venv*/*
    .pytest_cache/*

[coverage:report]
show_missing = True
skip_covered = False

[nosetests]
verbosity = 2
with-spec = 1
spec-color = 1
with-coverage = 1
cover-erase = 1
cover-package = app
exe = 1


[pylint]
disable = E1101,C0114,C0115,C0116,R0903,W0621
max-line-length = 120

