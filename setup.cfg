[flake8]
max-line-length = 100
exclude = .git,.venv,__pycache__

[tool:pytest]
testpaths = tests
addopts = -q

[coverage:run]
branch = True
source = .
omit =
    tests/*
    .venv/*

[coverage:report]
show_missing = True
skip_covered = False

[nosetests]
tests = tests
with-coverage = True
cover-package = app

[pylint]
disable = C0114,C0115,C0116,R0903,W0621
max-line-length = 100
